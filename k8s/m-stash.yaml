apiVersion: v1
kind: ConfigMap
metadata:
  name: m-stash-config
  labels:
    app.kubernetes.io/name: m-stash
data:
  gateway.json: |
    {
      "allowed_origins": ["https://app.example.com"],
      "rules": {
        "stashes": {
          "read": {"$or": [{"ownerId": "$auth.uid"}, {"isPublic": true}]},
          "write": {"ownerId": "$auth.uid"},
          "allowed_write_fields": ["ownerId", "title", "summary", "content", "tags", "isPublic"],
          "restricted_write_fields": ["role", "isVerified", "createdAt", "updatedAt"]
        },
        "profiles": {
          "read": {"_id": "$auth.uid"},
          "write": {"_id": "$auth.uid"},
          "allowed_write_fields": ["_id", "handle", "displayName", "bio", "avatarURL", "links", "isPublic"],
          "restricted_write_fields": ["role", "permissions", "email"]
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m-stash
  labels:
    app.kubernetes.io/name: m-stash
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: m-stash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: m-stash
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: m-stash
          image: YOUR_DOCKERHUB_USERNAME/m-stash:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: MONGO_URI
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: MONGO_DB
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: JWT_SECRET
            - name: M_STASH_CONFIG
              value: /etc/m-stash/gateway.json
          volumeMounts:
            - name: config
              mountPath: /etc/m-stash
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: m-stash-config
---
apiVersion: v1
kind: Service
metadata:
  name: m-stash
  labels:
    app.kubernetes.io/name: m-stash
spec:
  selector:
    app.kubernetes.io/name: m-stash
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
