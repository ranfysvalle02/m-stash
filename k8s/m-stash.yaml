apiVersion: v1
kind: ConfigMap
metadata:
  name: m-stash-config
  labels:
    app.kubernetes.io/name: m-stash
data:
  jwt_issuer: m-stash
  jwt_audience: m-stash
  trust_proxy: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m-stash
  labels:
    app.kubernetes.io/name: m-stash
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: m-stash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: m-stash
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: m-stash
          image: YOUR_DOCKERHUB_USERNAME/m-stash:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: MONGO_URI
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: MONGO_DB
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: JWT_SECRET
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: METRICS_TOKEN
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: ADMIN_EMAIL
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: ADMIN_PASSWORD
                  optional: true
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: SERVICE_TOKEN
                  optional: true
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: m-stash-config
                  key: jwt_issuer
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: m-stash-config
                  key: jwt_audience
            - name: TRUST_PROXY
              valueFrom:
                configMapKeyRef:
                  name: m-stash-config
                  key: trust_proxy
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: m-stash
  labels:
    app.kubernetes.io/name: m-stash
spec:
  selector:
    app.kubernetes.io/name: m-stash
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
