apiVersion: v1
kind: ConfigMap
metadata:
  name: m-stash-config
  labels:
    app.kubernetes.io/name: m-stash
data:
  jwt_issuer: m-stash
  jwt_audience: m-stash
  trust_proxy: "false"
  # Canonical public origin for OAuth callbacks and shared links. Leave blank to
  # derive it from the request host.
  public_base_url: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m-stash
  labels:
    app.kubernetes.io/name: m-stash
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: m-stash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: m-stash
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: m-stash
          image: YOUR_DOCKERHUB_USERNAME/m-stash:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: MONGO_URI
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: MONGO_DB
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: JWT_SECRET
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: METRICS_TOKEN
            - name: PLATFORM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: PLATFORM_TOKEN
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: m-stash-config
                  key: jwt_issuer
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: m-stash-config
                  key: jwt_audience
            - name: TRUST_PROXY
              valueFrom:
                configMapKeyRef:
                  name: m-stash-config
                  key: trust_proxy
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: m-stash-config
                  key: public_base_url
                  optional: true
            # Optional social login (OAuth2 + PKCE). Populate each provider's pair
            # in m-stash-secrets to enable it; optional keys keep existing clusters
            # (without these secret keys) booting unchanged.
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: GITHUB_CLIENT_ID
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: GITHUB_CLIENT_SECRET
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: m-stash-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: m-stash
  labels:
    app.kubernetes.io/name: m-stash
spec:
  selector:
    app.kubernetes.io/name: m-stash
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
