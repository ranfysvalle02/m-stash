# Do not commit a file containing real values. Apply this once per namespace:
# kubectl create secret generic m-stash-secrets \
#   --from-literal=MONGO_URI='mongodb+srv://...' \
#   --from-literal=MONGO_DB='app_db' \
#   --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#   --from-literal=METRICS_TOKEN="$(openssl rand -base64 48)" \
#   --from-literal=ADMIN_EMAIL='admin@example.com' \
#   --from-literal=ADMIN_PASSWORD='use-a-long-unique-password' \
#   --from-literal=SERVICE_TOKEN="$(openssl rand -base64 48)"
apiVersion: v1
kind: Secret
metadata:
  name: m-stash-secrets
  labels:
    app.kubernetes.io/name: m-stash
type: Opaque
stringData:
  MONGO_URI: mongodb+srv://replace-me
  MONGO_DB: app_db
  JWT_SECRET: replace-with-a-long-random-secret
  METRICS_TOKEN: replace-with-a-long-random-metrics-token
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: replace-with-a-long-unique-password
  SERVICE_TOKEN: replace-with-a-long-random-service-token
