# Do not commit a file containing real values. Apply this once per namespace:
# kubectl create secret generic m-stash-secrets \
#   --from-literal=MONGO_URI='mongodb+srv://...' \
#   --from-literal=MONGO_DB='app_db' \
#   --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#   --from-literal=METRICS_TOKEN="$(openssl rand -base64 48)" \
#   --from-literal=PLATFORM_TOKEN="$(openssl rand -base64 48)"
# Optional social login (OAuth2 + PKCE): add each provider's pair together, e.g.
#   --from-literal=GITHUB_CLIENT_ID='...' --from-literal=GITHUB_CLIENT_SECRET='...'
apiVersion: v1
kind: Secret
metadata:
  name: m-stash-secrets
  labels:
    app.kubernetes.io/name: m-stash
type: Opaque
stringData:
  MONGO_URI: mongodb+srv://replace-me
  MONGO_DB: app_db
  JWT_SECRET: replace-with-a-long-random-secret
  METRICS_TOKEN: replace-with-a-long-random-metrics-token
  PLATFORM_TOKEN: replace-with-a-long-random-platform-token
  # Optional social login. Leave blank to keep a provider disabled; set a
  # provider's ID and secret together (a half-set pair fails boot).
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
