services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-init:
    image: mongo:8
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        mongosh "mongodb://mongo:27017/?directConnection=true" --quiet --eval '
          try { rs.status() } catch (error) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}) }
          while (!db.hello().isWritablePrimary) { sleep(1) }
        '

  m-stash:
    build: .
    image: m-stash:local
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: ${MONGO_DB:-app_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-m-stash}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-m-stash}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:4000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongo-data:
