services:
  - type: web
    name: m-stash
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: app_db
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_TOKEN
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"