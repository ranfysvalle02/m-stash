services:
  - type: web
    name: m-stash
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: app_db
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_TOKEN
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      # Let visitors try m-stash live and keep their app via self-serve signup.
      - key: TRY_SANDBOX
        value: "on"
      - key: BUILDER_SIGNUP
        value: "open"
      # Canonical origin for OAuth callbacks and shared links.
      - key: PUBLIC_BASE_URL
        sync: false
      # Optional social login (OAuth2 + PKCE). Enter each provider's pair in the
      # Render dashboard; leave blank to keep the provider disabled.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false