name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify browser workspace
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build

      # Integration tests drive the real HTTP handler against a real replica set
      # (claim, owner login, social sign-in, token revocation, ledger, stats).
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 127.0.0.1:27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 60); do docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]})"
          for _ in $(seq 1 60); do [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break; sleep 1; done

      - name: Verify Go source
        env:
          MSTASH_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
        run: |
          go vet ./...
          go test -race ./...

      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build both release architectures on every push/PR so a container defect
      # can never slip through to a v* release tag again. No QEMU: the Dockerfile
      # cross-compiles natively on the runner.
      - name: Verify multi-platform Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
